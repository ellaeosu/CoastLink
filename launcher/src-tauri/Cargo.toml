[package]
name = "coastlink"
version = "0.6.4"
description = "CoastLink: rollback netplay launcher for OpenSmash-Ultimate"
authors = ["CoastLink contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
